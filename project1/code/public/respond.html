<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>填写问卷</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/respond.js" defer></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h1 id="survey-title">填写问卷</h1>
    <div id="page-message" class="message" role="status" tabindex="-1">正在加载问卷……</div>
    <section id="survey-info" class="panel" hidden>
      <p id="survey-description" class="preserve-text"></p>
      <p id="survey-deadline" class="hint"></p>
      <p id="participation-hint" class="notice"></p>
    </section>
    <section id="login-prompt" class="panel" hidden>
      <h2>请先登录</h2>
      <p>本问卷需要登录后填写。禁止重复填写时，即使允许匿名也必须登录。</p>
      <a id="respond-login" class="button" href="/login">登录后继续</a>
    </section>
    <form id="respond-form" class="panel" novalidate hidden>
      <p id="question-progress" class="hint" aria-live="polite"></p>
      <div id="question-container"></div>
      <div id="answer-message" class="message error" role="alert" tabindex="-1" hidden></div>
      <p class="hint">返回修改会清除后续答案，需要重新填写。只有实际访问路径中的非空答案会提交。</p>
      <div class="actions">
        <button id="previous-question" type="button" class="secondary">上一题</button>
        <button id="next-question" type="submit">下一题</button>
      </div>
    </form>
    <section id="submit-panel" class="panel" hidden>
      <h2>已到达问卷结束</h2>
      <p id="submit-summary"></p>
      <p>请确认后提交；提交成功后显示通用完成提示。</p>
      <div class="actions">
        <button id="edit-last-question" type="button" class="secondary">返回修改</button>
        <button id="submit-response" type="button">提交问卷</button>
      </div>
    </section>
    <noscript><p class="notice">请启用 JavaScript 后填写问卷。</p></noscript>
  </main>
</body>
</html>

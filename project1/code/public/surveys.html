<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>我的问卷 - 问卷系统</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/surveys.js" defer></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <h1>我的问卷</h1>
    <div id="page-message" class="message" role="alert" tabindex="-1" hidden></div>
    <section class="panel">
      <h2>创建问卷</h2>
      <form id="create-form">
        <fieldset id="create-fields" disabled>
          <label class="field">标题（最多 200 字符）
            <input name="title" required maxlength="200">
          </label>
          <label class="field">说明（最多 5000 字符）
            <textarea name="description" maxlength="5000"></textarea>
          </label>
          <label class="field">截止时间（可留空，使用本地时间）
            <input name="deadline" type="datetime-local">
          </label>
          <label class="check"><input name="allowAnonymous" type="checkbox">允许匿名填写</label>
          <label class="check"><input name="allowMultipleResponses" type="checkbox" checked>允许重复填写</label>
          <p id="participation-hint" class="notice"></p>
          <button type="submit">创建并编辑</button>
        </fieldset>
      </form>
    </section>
    <section class="panel">
      <div class="section-heading"><h2>问卷列表</h2><button id="refresh" type="button" class="secondary">刷新</button></div>
      <p id="list-summary" class="hint"></p>
      <div class="table-wrap">
        <table>
          <thead><tr><th>标题</th><th>状态 / 截止时间</th><th>操作</th></tr></thead>
          <tbody id="survey-list"></tbody>
        </table>
      </div>
      <div class="actions">
        <button id="previous" type="button" class="secondary" disabled>上一页</button>
        <span id="page-number"></span>
        <button id="next" type="button" class="secondary" disabled>下一页</button>
      </div>
    </section>
  </main>
</body>
</html>

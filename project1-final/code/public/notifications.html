<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>通知 - 问卷系统</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/common.js" defer></script>
  <script src="/js/notifications.js" defer></script>
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="section-heading"><h1>我的通知</h1><a href="/question-library">查看个人题库</a></div>
    <p class="notice">这里显示其他用户分享给你的题目。查看后可选择加入个人题库，也可以直接删除通知；双方的题目独立使用，修改互不影响。</p>
    <div id="page-message" class="message" role="alert" tabindex="-1" hidden></div>
    <section id="notification-content" class="panel" hidden>
      <div class="section-heading"><h2>收到的题目</h2><button id="refresh-notifications" type="button" class="secondary">刷新通知</button></div>
      <div id="notification-list"></div>
      <div class="actions"><button id="previous-notifications" type="button" class="secondary">上一页</button><span id="notification-summary"></span><button id="next-notifications" type="button" class="secondary">下一页</button></div>
    </section>
  </main>
</body>
</html>
